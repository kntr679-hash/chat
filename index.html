<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>オンラインチャット</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#1f7a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #f3f5f2; --panel: #ffffff; --ink: #1d2623; --sub: #6b7872;
    --line: #dde3df; --accent: #1f7a5c; --accent-ink: #ffffff; --mine: #d9efe6; --theirs: #eef0ee;
    --dot: #2bb673;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141918; --panel: #1c2321; --ink: #e6ece9; --sub: #8fa098;
      --line: #2c3633; --accent: #3fc08f; --accent-ink: #0f1a16; --mine: #234a3c; --theirs: #263130;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: var(--vh, 100dvh); margin: 0; overflow: hidden; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #login { display: grid; place-items: center; height: 100%; padding: 16px; }
  #login form, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; width: min(360px, 100%); }
  #login h1 { font-size: 20px; margin: 0 0 4px; }
  #login p { color: var(--sub); margin: 0 0 16px; font-size: 14px; }
  #login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); margin-bottom: 12px; }
  .primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; width: 100%; }

  #app { display: none; height: 100%; grid-template-columns: 260px 1fr; }
  #side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #side header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  #side header b { display: block; font-size: 15px; }
  #status { font-size: 12px; color: var(--sub); }
  #list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  #list li button {
    width: 100%; text-align: left; background: none; border: 0; border-radius: 8px;
    padding: 10px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  #list li button:hover { background: var(--bg); }
  #list li button[aria-current="true"] { background: var(--mine); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); flex: none; }
  .badge { margin-left: auto; background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 12px; padding: 1px 7px; }
  #empty { color: var(--sub); font-size: 14px; padding: 16px; }

  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #main header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: center; gap: 10px; }
  #back { display: none; background: none; border: 0; cursor: pointer; font-size: 18px; padding: 0 6px 0 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .hint { margin: auto; color: var(--sub); font-size: 14px; text-align: center; }
  .row { position: relative; display: flex; overflow: hidden; border-radius: 12px; flex: none; }
  .row.mine { justify-content: flex-end; }
  .m { position: relative; max-width: min(75%, 520px); padding: 8px 12px; border-radius: 12px; background: var(--theirs); overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.5; touch-action: pan-y; transition: transform .2s ease; }
  .mine .m { background: var(--mine); cursor: grab; user-select: none; -webkit-user-select: none; }
  .m small { display: block; color: var(--sub); font-size: 11px; margin-top: 2px; }
  .slide { position: relative; display: flex; justify-content: flex-end; width: 100%; transition: transform .2s ease; }
  .acts { position: absolute; left: 100%; top: 0; bottom: 0; display: flex; width: 128px; }
  .acts button { flex: 1; border: 0; color: #fff; cursor: pointer; font-size: 13px; }
  .acts .ed { background: #6b7872; }
  .acts .del { background: #d93a3a; }
  .dot.off { background: var(--sub); opacity: .5; }
  #peerState { font-size: 12px; color: var(--sub); }
  #editbar { display: none; padding: 6px 12px; font-size: 13px; color: var(--sub); background: var(--panel); border-top: 1px solid var(--line); }
  #editbar button { background: none; border: 0; color: var(--accent); cursor: pointer; margin-left: 8px; }
  .note { align-self: center; color: var(--sub); font-size: 12px; }
  #send { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); background: var(--panel); }
  #send input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-width: 0; }
  #send button { width: auto; }
  #send :disabled { opacity: .5; cursor: not-allowed; }

  @media (max-width: 640px) {
    #app { grid-template-columns: 1fr; }
    #app[data-view="chat"] #side { display: none; }
    #app[data-view="list"] #main { display: none; }
    #back { display: block; }
  }
  .m img { display: block; max-width: min(240px, 100%); border-radius: 8px; margin-bottom: 4px; cursor: pointer; }
  #attach { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; cursor: pointer; }
  #selBtn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  #selbar { display: none; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  #selbar span { margin-right: auto; font-size: 14px; }
  #selbar button, .dlgBtns button { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  .danger { background: #d93a3a !important; color: #fff !important; border-color: #d93a3a !important; }
  .danger:disabled { opacity: .5; cursor: not-allowed; }
  #msgs.selecting .row { cursor: pointer; }
  #msgs.selecting .row:not(.mine) { opacity: .45; cursor: default; }
  .row.sel .m { outline: 2px solid var(--accent); }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); padding: 20px; max-width: min(360px, 90vw); }
  dialog::backdrop { background: rgba(0, 0, 0, .4); }
  .dlgBtns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .dlgBtns button { color: var(--ink); }
  #send { align-items: flex-end; }
  #send button { height: 42px; }
  #send textarea { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); resize: none; max-height: 140px; line-height: 1.4; overflow-y: auto; }
  #kbHint { margin: 0; padding: 0 12px 8px; font-size: 11px; color: var(--sub); background: var(--panel); }
  #peerState { margin-right: auto; }
  #favBtn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
  #sideFoot { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 10px; border-top: 1px solid var(--line); }
  #sideFoot button { background: none; border: 0; color: var(--sub); font-size: 12px; cursor: pointer; padding: 4px 6px; }
  .seen { color: var(--sub); font-size: 11px; }
  .m a { color: inherit; text-decoration: underline; word-break: break-all; }
  .linkbtn { background: none; border: 0; color: var(--sub); font-size: 13px; cursor: pointer; margin-top: 12px; width: 100%; }
  #renameBtn { background: none; border: 0; cursor: pointer; color: var(--sub); padding: 0 6px; }
  dialog button { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; color: var(--ink); }
  #linkDlg input { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); text-transform: uppercase; width: 16em; }
  #codeOut { display: block; font-size: 15px; letter-spacing: .08em; word-break: break-all; margin: 4px 0 12px; }
  #callBtn, #vcallBtn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  #callBar { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 50; align-items: center; gap: 8px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: 0 4px 16px rgba(0, 0, 0, .25); }
  #callBar button { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; color: var(--ink); }
  .ok { background: #2bb673 !important; color: #fff !important; border-color: #2bb673 !important; }
  #attachBar { display: none; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  #attachBar img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
  #attachBar span { flex: 1; min-width: 0; font-size: 13px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #attachBar button { border: 0; background: none; cursor: pointer; font-size: 18px; color: var(--sub); }
  #callDbg { font-size: 11px; color: var(--sub); max-width: 240px; }
  #videoBox { position: fixed; inset: 0; z-index: 40; background: #000; }
  #remoteVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #localVideo { position: absolute; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 28vw; max-width: 170px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .4); background: #222; transform: scaleX(-1); }
  #callBar { flex-wrap: wrap; justify-content: center; width: min(94vw, 440px); }
  #callText { flex: 1 1 100%; text-align: center; font-weight: 600; }
  #callDbg { flex: 1 1 100%; max-width: none; text-align: center; }
  #updBar { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 60; align-items: center; gap: 10px; background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 999px; box-shadow: 0 4px 16px rgba(0, 0, 0, .25); font-size: 14px; }
  #updBar button { border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; background: var(--accent-ink); color: var(--accent); font-weight: 600; }
  /* 通話中のバーを半透明に */
  #callBar { background: rgba(255, 255, 255, .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border-color: rgba(255, 255, 255, .35); }
  @media (prefers-color-scheme: dark) { #callBar { background: rgba(28, 35, 33, .55); border-color: rgba(255, 255, 255, .15); } }
  /* 左の一覧を最小化(PCのみ) */
  #side header { position: relative; }
  #minBtn { position: absolute; right: 8px; top: 10px; border: 0; background: none; cursor: pointer; color: var(--sub); font-size: 16px; }
  .ini { display: none; }
  @media (max-width: 640px) { #minBtn { display: none; } }
  @media (min-width: 641px) {
    #app.min { grid-template-columns: 64px 1fr; }
    #app.min #side header { height: 56px; padding: 0; }
    #app.min #side header > :not(#minBtn) { display: none; }
    #app.min #minBtn { position: static; width: 100%; }
    #app.min #empty, #app.min #sideFoot { display: none !important; }
    #app.min #list li button { justify-content: center; padding: 8px 0; gap: 0; position: relative; }
    #app.min #list li button > span:not(.dot):not(.ini):not(.badge) { display: none; }
    #app.min .ini { display: inline-flex; width: 36px; height: 36px; border-radius: 50%; background: var(--bg); align-items: center; justify-content: center; font-size: 15px; }
    #app.min .dot { position: absolute; left: 10px; top: 8px; border: 2px solid var(--panel); box-sizing: content-box; }
    #app.min .badge { position: absolute; right: 6px; top: 4px; }
  }
  #minBtn { right: 8px; top: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font-size: 12px; padding: 4px 8px; }
  #app.min #minBtn { white-space: pre-line; line-height: 1.25; background: var(--mine); border: 0; border-radius: 0; height: 56px; font-size: 12px; font-weight: 600; }
  #blurRow { flex: 1 1 100%; align-items: center; gap: 10px; font-size: 13px; }
  #blurRow input { flex: 1; min-width: 0; accent-color: var(--accent); }
  #blurRow b { min-width: 3.2em; text-align: right; }
</style>
</head>
<body>

<div id="login">
  <form id="loginForm">
    <h1>オンラインチャット</h1>
    <p>このページを開いている人と話せます。名前を入れてね。</p>
    <input id="nameInput" maxlength="20" placeholder="名前" required autocomplete="nickname">
    <p id="loginMsg" style="color:#d93a3a;font-size:13px;margin:0 0 12px"></p>
    <button class="primary" type="submit">入る</button>
    <button type="button" id="linkOpenLogin" class="linkbtn">別の端末のアカウントを使う</button>
  </form>
</div>

<div id="app" data-view="list">
  <aside id="side">
    <header>
      <button type="button" id="minBtn" title="左の一覧を最小化 / 開く">◀ 最小化</button><b id="me"></b><button type="button" id="renameBtn" title="名前を変更">✎</button>
      <span id="status">接続中…</span>
    </header>
    <ul id="list"></ul>
    <p id="empty">いまオンラインの人はいません。別のタブやスマホで開くと表示されます。</p>
    <div id="sideFoot"><button type="button" id="notifyBtn">🔔 通知 ON</button><button type="button" id="linkOpen">🔗 他の端末とつなぐ</button><button type="button" id="installBtn">📲 ホーム画面に追加</button><small id="ver" class="seen" style="width:100%;padding:0 6px"></small></div>
  </aside>
  <section id="main">
    <header>
      <button id="back" aria-label="一覧に戻る">←</button>
      <b id="peerName">相手を選んでください</b>
      <span id="peerState"></span>
      <button type="button" id="callBtn" style="display:none" title="音声通話">📞</button>
      <button type="button" id="vcallBtn" style="display:none" title="ビデオ通話">🎥</button>
      <button type="button" id="favBtn" style="display:none">☆ フレンド追加</button>
      <button type="button" id="selBtn">選択</button>
    </header>
    <div id="msgs"><p class="hint">左の一覧から、話したい人をクリック</p></div>
    <div id="selbar"><span id="selCount">0件選択中</span><button type="button" id="selCancel">キャンセル</button><button type="button" id="selDel" class="danger" disabled>削除</button></div>
    <div id="editbar">編集中… <button type="button" id="cancelEdit">キャンセル</button></div>
    <div id="attachBar">
      <img id="attachThumb" alt="添付する画像">
      <span id="attachName"></span>
      <button type="button" id="attachX" aria-label="添付を外す">✕</button>
    </div>
    <form id="send">
      <button type="button" id="attach" aria-label="画像を送る" disabled>📎</button>
      <input type="file" id="file" accept="image/*" hidden>
      <textarea id="text" rows="1" maxlength="1000" placeholder="メッセージ" autocomplete="off" disabled></textarea>
      <button class="primary" type="submit" disabled>送信</button>
    </form>
    <p id="kbHint">Enter で送信 ・ Shift + Enter で改行</p>
  </section>
</div>

<div id="updBar" style="display:none"><span>新しい版があります</span><button type="button" id="updBtn">更新</button></div>
<div id="videoBox" style="display:none">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
</div>
<div id="callBar" style="display:none">
  <span id="callText"></span><small id="callDbg"></small>
  <button type="button" id="callAnswer" class="ok">応答</button>
  <button type="button" id="callMute">🎙 ミュート</button>
  <button type="button" id="callCam" style="display:none">📷 カメラ停止</button>
  <button type="button" id="callFlip" style="display:none">🔄 カメラ切替</button>
  <button type="button" id="callBlur" style="display:none">🌫 ぼかし</button>
  <div id="blurRow" style="display:none"><span>ぼかし</span><input type="range" id="blurRange" min="0" max="100" step="1" value="50"><b id="blurVal">50%</b></div>
  <button type="button" id="callEnd" class="danger">切る</button>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>
<video id="srcVideo" autoplay playsinline muted style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>

<dialog id="linkDlg">
  <p>別の端末(Webとホーム画面のアプリなど)を、同じアカウントにつなぎます。</p>
  <p><b>① つなぐ元(いま使っている端末)</b><br>
    <button type="button" id="mkCode">コードを作る</button> <button type="button" id="copyCode" style="display:none">コピー</button></p>
  <code id="codeOut"></code>
  <p><b>② つなぐ先(新しい端末)</b><br>
    <button type="button" id="pasteCode">貼り付けてつなぐ</button></p>
  <p><input id="codeIn" placeholder="または、ここにコードを貼り付け" maxlength="40"> <button type="button" id="useCode">つなぐ</button></p>
  <p id="linkMsg" class="seen"></p>
  <p id="devInfo" class="seen"></p>
  <p><button type="button" id="unlinkOthers" style="display:none">この端末以外を外す</button></p>
  <div class="dlgBtns"><button type="button" id="linkClose">閉じる</button></div>
</dialog>

<dialog id="cleanDlg">
  <p id="cleanMsg"></p>
  <div class="dlgBtns"><button type="button" id="cleanNo">消さない</button><button type="button" id="cleanYes" class="danger">消す</button></div>
</dialog>

<script>
const SUPABASE_URL = "https://yhlldyozjcrwqltazcwz.supabase.co";
const SUPABASE_KEY = "sb_publishable_9B7dmMZ859WHV5BMswweBA_c8OHLSbt";

// ホーム画面用のアイコンとmanifestは、別ファイルを使わずページの中で作る
(() => {
  const icon = (n) => {
    const c = document.createElement("canvas");
    c.width = c.height = n;
    const g = c.getContext("2d");
    g.fillStyle = "#1f7a5c"; g.fillRect(0, 0, n, n);
    g.font = Math.round(n * 0.6) + "px serif"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText("💬", n / 2, n * 0.54);
    return c.toDataURL("image/png");
  };
  const base = location.origin + location.pathname.replace(/[^/]*$/, "");
  const mf = {
    name: "オンラインチャット", short_name: "チャット", start_url: base, scope: base,
    display: "standalone", background_color: "#f3f5f2", theme_color: "#1f7a5c",
    icons: [192, 512].map((n) => ({ src: icon(n), sizes: n + "x" + n, type: "image/png", purpose: "any" })),
  };
  const m = document.createElement("link");
  m.rel = "manifest";
  m.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: "application/manifest+json" }));
  const a = document.createElement("link");
  a.rel = "apple-touch-icon"; a.href = icon(180);
  document.head.append(m, a);
})();
const qs = new URLSearchParams(location.search);
const W = 128;                                   // スワイプで出るボタン幅
const BUCKET = "chat-images";
const clean = (s) => s.replace(/#/g, "").trim().slice(0, 20);   // # は内部IDの区切りに使う
const nicks = {};                                                // 内部ID → 表示名
const disp = (id) => nicks[id] || id.split("#")[0];
let want = clean(qs.get("me") || "");   // 入力された名前
let me = "", myNick = "";               // 内部ID / 表示名
let wantYou = clean(qs.get("you") || "") || null;                // 表示名で指定された相手
let current = wantYou;
let sb, channel, uid, online = new Set(), editingId = null, openEl = null, lastTyping = 0, ac = null;
const logs = {};                                 // 相手の名前 -> メッセージ配列
const typingUntil = {};
let selecting = false, offered = false, installEvt = null, notifyOn = false, pushActive = false, pushEndpoint = null, fgTok = "", callSt = null;
try { notifyOn = localStorage.getItem("notify") === "1"; } catch (e) {}
let friends = new Set();
const lastSeen = {};
const selected = new Set();
const NG = [];   // 送れない言葉。例: ["ばか", "あほ"]
const hasNG = (t) => NG.some((w) => w && t.includes(w));
const q = (s) => '"' + s.replace(/(["\\])/g, "\\$1") + '"';
const other = (r) => (r.from_name === me ? r.to_name : r.from_name);

// キーボードが出ても上のバー(オンライン表示)が画面の外に押し出されないよう、見えている範囲に高さを合わせる
if (window.visualViewport) {
  const fit = () => { document.documentElement.style.setProperty("--vh", visualViewport.height + "px"); scrollTo(0, 0); };
  visualViewport.addEventListener("resize", fit);
  visualViewport.addEventListener("scroll", fit);
  fit();
}

try { $("nameInput").value = want || localStorage.getItem("chat-name") || ""; } catch (e) { $("nameInput").value = want; }
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  if (!n) return;
  want = n;

  try { await signIn(); await claim(n); } catch (e2) { return fail(e2.message); }

});

// 通知音(ブラウザの決まりで、最初に1回ページを触ったあとから鳴る)
const unlock = () => { try { ac ||= new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {} };
addEventListener("pointerdown", unlock);
addEventListener("keydown", unlock);
function beep() {
  if (!notifyOn || !ac || ac.state !== "running") return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.frequency.value = 880;
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(t + 0.25);
}

function fail(msg) {
  $("app").style.display = "none";
  $("login").style.display = "grid";
  $("loginMsg").textContent = msg;
}

// ログイン: 端末ごとの匿名ID → アカウント(引き継ぎコードで複数の端末で共有できる)
async function signIn() {
  sb = sb || supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let { data: { session } } = await sb.auth.getSession();
  if (!session) {
    const r = await sb.auth.signInAnonymously();
    if (r.error) throw new Error("匿名ログインに失敗: " + r.error.message + "(Supabase で Anonymous sign-ins をオンにしてね)");
    session = r.data.session;
  }
  uid = session.user.id;
}
async function init() {
  try {
    await signIn();
    const r = await sb.rpc("my_profiles");
    if (r.error) throw new Error(r.error.message + "(SQLを実行したか確認してね)");
    if (r.data.length) {   // もうアカウントがある: 名前は聞かずに入る(名前は ✎ で変えられる)
      let saved = "";
      try { saved = localStorage.getItem("chat-name") || ""; } catch (e) {}
      const p = r.data.find((x) => x.nick === (want || saved)) || r.data[0];
      me = p.name; myNick = p.nick;
      return start();
    }
    if (want) { await claim(want); start(); }
  } catch (e) { fail(e.message); }
}
// 新しいアカウントを作る。内部IDがかぶったら #XXXX を付ける(画面には出ない)
async function claim(nick) {
  const a = await sb.rpc("ensure_account");
  if (a.error) throw new Error(a.error.message + "(SQLを実行したか確認してね)");
  let id = nick, ok = false;
  for (let i = 0; i < 6; i++) {
    const r = await sb.from("profiles").insert({ name: id, uid, account: a.data, nick });
    if (!r.error) { ok = true; break; }
    if (r.error.code !== "23505") throw new Error(r.error.message);
    id = nick + "#" + Math.random().toString(36).slice(2, 6).toUpperCase();
  }
  if (!ok) throw new Error("登録できませんでした。もう一度試してね");
  me = id; myNick = nick;
}
function start() {
  if (current === me) current = null;
  $("loginMsg").textContent = "";
  $("login").style.display = "none";
  $("app").style.display = "grid";
  $("me").textContent = myNick;
  connect();
  if (current) openChat(current);
  paintNotify();
  if (notifyOn) enablePush(false);
}

function connect() {
  channel = sb.channel("lobby", { config: { presence: { key: me } } });
  channel.on("presence", { event: "sync" }, () => {
    const prev = online;
    online = new Set(Object.keys(channel.presenceState()).filter((n) => n !== me));
    for (const [id, ms] of Object.entries(channel.presenceState())) if (ms[0] && ms[0].nick) nicks[id] = ms[0].nick;
    for (const id of prev) if (!online.has(id)) lastSeen[id] = Date.now();
    const before = current;
    resolveYou();
    renderList(); renderHead();
    if (current !== before || (current && !(logs[current] || []).length)) renderMsgs(true);
  });
  channel.on("broadcast", { event: "typing" }, ({ payload }) => {
    if (payload.to !== me) return;
    typingUntil[payload.from] = Date.now() + 3000;
    renderHead(); setTimeout(renderHead, 3100);
  });
  channel.on("postgres_changes", { event: "*", schema: "public", table: "messages" }, onChange);
  channel.on("postgres_changes", { event: "INSERT", schema: "public", table: "call_signals" }, onSignal);
  channel.subscribe(async (status) => {
    if (status === "SUBSCRIBED") {
      await channel.track({ name: me, nick: myNick });
      $("status").textContent = "接続済み";
      loadHistory();
    } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
      $("status").textContent = "接続エラー(設定を確認してね)";
    } else if (status === "CLOSED") {
      $("status").textContent = "切断されました";
    }
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadHistory(); } });
  setInterval(heartbeat, 60000);
  setInterval(() => { renderList(); renderHead(); }, 30000);
}

function add(r) {
  const l = (logs[other(r)] ||= []);
  if (l.some((m) => m.id === r.id)) return false;
  l.push(r);
  l.sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
  return true;
}
// ?you=名前 で指定された表示名に合う相手を探す(オンラインの人を優先)
function resolveYou() {
  if (!wantYou || (current && online.has(current))) return;
  const ids = [...online, ...Object.keys(logs)].filter((id) => id !== me && (id === wantYou || disp(id) === wantYou));
  const pick = ids.find((id) => online.has(id)) || ids[0];
  if (pick) current = pick;
}
function replace(r) { const p = other(r); logs[p] = (logs[p] || []).map((m) => (m.id === r.id ? r : m)); }
function err(e) { $("status").textContent = "エラー: " + e.message; }

async function loadHistory() {
  const { data, error } = await sb.from("messages").select("*")
    .or(`from_name.eq.${q(me)},to_name.eq.${q(me)}`)
    .order("created_at", { ascending: false }).limit(500);
  if (error) return err(error);
  await loadFriends();
  for (const k in logs) delete logs[k];
  data.forEach((r) => add(r));
  resolveYou(); renderHead(); renderList(); renderMsgs(true); markRead();
  if (!offered) { offered = true; offerCleanup(); }
  heartbeat();
  checkPendingCall();
}

function onChange(p) {
  if (p.eventType === "DELETE") {
    for (const k in logs) logs[k] = logs[k].filter((m) => m.id !== p.old.id);
  } else {
    const r = p.new;
    if (r.from_name !== me && r.to_name !== me) return;
    if (p.eventType === "UPDATE") replace(r);
    else if (add(r) && r.from_name !== me) { typingUntil[r.from_name] = 0; beep(); popup(r); }
  }
  renderList(); renderMsgs(); renderHead(); markRead();
}

// いま開いている会話の、相手からの未読を「既読」にする
function markRead() {
  if (!current || document.hidden) return;
  const l = logs[current] || [];
  const ids = l.filter((m) => m.to_name === me && !m.read_at).map((m) => m.id);
  if (!ids.length) return;
  const now = new Date().toISOString();
  l.forEach((m) => { if (ids.includes(m.id)) m.read_at = now; });
  sb.from("messages").update({ read_at: now }).in("id", ids).then(({ error }) => error && err(error));
  renderList();
}

const p2 = (n) => String(n).padStart(2, "0");
const fmtDate = (d) => d.getFullYear() + "/" + p2(d.getMonth() + 1) + "/" + p2(d.getDate());
const fmtTime = (d) => fmtDate(d) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
const dayStart = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());          // 時刻を切り捨てて、その日の0時にする
const daysAgo = (d) => Math.round((dayStart(new Date()) - dayStart(d)) / 864e5);        // 日付で数えて、何日前か
function ago(t) {
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  return s < 60 ? s + "秒前" : s < 3600 ? Math.floor(s / 60) + "分前" : s < 86400 ? Math.floor(s / 3600) + "時間前" : Math.floor(s / 86400) + "日前";
}

}

function renderList() {

  const ids = [...people].filter((n) => n !== me)
    .sort((a, b) => online.has(b) - online.has(a) || friends.has(b) - friends.has(a) || a.localeCompare(b));
  $("empty").style.display = ids.length ? "none" : "block";

// 左にスワイプ(PCはドラッグ)で「編集」「削除」が出る
function swipe(el, t) {
  let sx = null, x = 0, base = 0, moved = false;
  const set = (v, anim) => { t.style.transition = anim ? "" : "none"; t.style.transform = v ? `translateX(${v}px)` : ""; x = v; };
  el.addEventListener("pointerdown", (e) => {
    if (e.target.closest("a")) return;   // リンクのタップはスワイプにしない
    if (openEl && openEl !== el) openEl.close();
    sx = e.clientX; base = x; moved = false; el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", (e) => {
    if (sx === null) return;
    if (Math.abs(e.clientX - sx) > 4) moved = true;
    set(Math.max(-W, Math.min(0, base + e.clientX - sx)), false);
  });
  const end = () => {
    if (sx === null) return;
    sx = null;
    const open = !moved && base ? false : x < -W / 2;
    set(open ? -W : 0, true);
    openEl = open ? el : openEl === el ? null : openEl;
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.close = () => set(0, true);
}

// まとめて削除(相手の画面からも消える)
async function deleteMany(ids) {
  const targets = Object.values(logs).flat().filter((m) => ids.has(m.id) && m.from_name === me);
  const done = new Set();
  for (let i = 0; i < targets.length; i += 50) {
    const { data, error } = await sb.from("messages").delete().in("id", targets.slice(i, i + 50).map((m) => m.id)).select("id");
    if (error) { err(error); break; }
    data.forEach((r) => done.add(r.id));
  }
  const paths = targets.filter((m) => done.has(m.id) && m.image_url).map((m) => m.image_url.split("/" + BUCKET + "/")[1]);
  if (paths.length) sb.storage.from(BUCKET).remove(paths);
  for (const k in logs) logs[k] = logs[k].filter((m) => !done.has(m.id));
  if (done.size < targets.length) $("status").textContent = (targets.length - done.size) + "件は消せませんでした";
  renderMsgs(); renderList();
}

$("selBtn").addEventListener("click", () => { if (current) setSelect(!selecting); });
$("selCancel").addEventListener("click", () => setSelect(false));
$("selDel").addEventListener("click", async () => { await deleteMany(new Set(selected)); setSelect(false); });

// 3日より前のメッセージを消すか聞く(聞くのは1日1回まで)
function offerCleanup() {
  const old = Object.values(logs).flat().filter((m) => m.from_name === me && daysAgo(new Date(m.created_at)) >= 3);
  if (!old.length) return;
  const key = "cleanup-asked:" + me, today = new Date().toDateString();
  try { if (localStorage.getItem(key) === today) return; } catch (e) {}
  const cut = dayStart(new Date());
  cut.setDate(cut.getDate() - 3);
  $("cleanMsg").textContent = fmtDate(cut) + " 以前に送った、自分のメッセージが" + old.length + "件あります。消しますか?(相手の画面からも消えます。相手が送った分は残ります)";
  $("cleanYes").onclick = async () => { $("cleanDlg").close(); await deleteMany(new Set(old.map((m) => m.id))); };
  $("cleanNo").onclick = () => { try { localStorage.setItem(key, today); } catch (e) {} $("cleanDlg").close(); };
  $("cleanDlg").showModal();
}

async function remove(m) {
  if (editingId === m.id) { setEdit(null); setText(""); }
  const { error } = await sb.from("messages").delete().eq("id", m.id);
  if (error) return err(error);
  if (m.image_url) sb.storage.from(BUCKET).remove([m.image_url.split("/" + BUCKET + "/")[1]]);
  for (const k in logs) logs[k] = logs[k].filter((x) => x.id !== m.id);
  renderMsgs(); renderList();
}

async function send(fields) {

$("send").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();

// 画像: 長辺1280pxに縮めてJPEGにしてから送る
async function shrink(f) {
  const bmp = await createImageBitmap(f);
  const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.82));
}
$("attach").addEventListener("click", () => $("file").click());
// 画像は、えらんだらすぐ送らずに「添付」として入力欄の上に出す。送信ボタンで、文字といっしょに送る
let pendingImg = null;
function clearAttach() {
  if (pendingImg) URL.revokeObjectURL(pendingImg.url);
  pendingImg = null;
  $("attachBar").style.display = "none";
}
$("attachX").addEventListener("click", clearAttach);
$("file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f || !current) return;
  if (!f.type.startsWith("image/") || f.size > 20e6) { $("status").textContent = "画像(20MBまで)を選んでね"; return; }
  try {
    const blob = await shrink(f);
    clearAttach();
    pendingImg = { blob, url: URL.createObjectURL(blob) };
    $("attachThumb").src = pendingImg.url;
    $("attachName").textContent = f.name + "(" + Math.round(blob.size / 1024) + "KB)";
    $("attachBar").style.display = "flex";
    $("text").focus();
  } catch (e2) { err(e2); }
});

function linkify(t) {

  src.connect(proc); proc.connect(ac.destination);
  c.src = src; c.proc = proc;
  c.timeout = setTimeout(() => { if (!c.gotAudio) endCall("つながりませんでした(中継でも音声が届きませんでした)"); }, 20000);
}

// 着信の通知から開いたとき: まだ呼び出し中の着信があれば、応答画面を出す
async function checkPendingCall() {
  if (callSt) return;
  const since = new Date(Date.now() - 65000).toISOString();
  const { data } = await sb.from("call_signals").select("*").eq("to_name", me).gte("created_at", since).order("created_at");
  if (!data) return;
  const ended = new Set(data.filter((r) => ["hangup", "reject", "busy"].includes(r.kind)).map((r) => r.call_id));
  const inv = data.filter((r) => r.kind === "invite" && !ended.has(r.call_id)).pop();
  if (inv) onSignal({ new: inv });
}

// ===== 内カメ / 外カメ、画質 =====
async function flipCam() {
  const c = callSt;
  if (!c || !c.video || !c.stream) return;
  const old = c.stream.getVideoTracks()[0];
  const wasOn = old ? old.enabled : true;
  const prev = c.facing || "user";
  const next = prev === "user" ? "environment" : "user";
  if (old) old.stop();   // スマホは、カメラを2つ同時に使えないことがあるので、先に止める
  let nt = null;
  for (const f of [next, prev]) {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: f, width: { ideal: 640 }, height: { ideal: 480 } } });
      nt = s.getVideoTracks()[0];
      c.facing = f;
      break;
    } catch (e) {}
  }
  if (!nt) { $("status").textContent = "カメラを切り替えられませんでした"; return; }
  nt.enabled = wasOn;
  if (c.blurOn) $("srcVideo").srcObject = new MediaStream([nt]);   // ぼかし中は、ぼかしの元の映像だけ差し替える
  else {
    try {
      const sender = c.pc && c.pc.getSenders().find((x) => x.track && x.track.kind === "video");
      if (sender) await sender.replaceTrack(nt);
    } catch (e) {}
  }
  if (old) c.stream.removeTrack(old);
  c.stream.addTrack(nt);
  if (!c.blurOn) $("localVideo").srcObject = c.stream;
  $("localVideo").style.transform = c.facing === "user" ? "scaleX(-1)" : "none";   // 内カメだけ鏡のように反転
}
// ぼかし: 相手に送る映像を、ぼかす。0〜100%(最初は50%)で、いつでも変えられる
const CAN_FILTER = (() => {
  try { const x = document.createElement("canvas").getContext("2d"); x.filter = "blur(2px)"; return x.filter === "blur(2px)"; }
  catch (e) { return false; }
})();
function blurDraw(c) {
  const v = $("srcVideo");
  if (!v.videoWidth) return;
  const cv = c.cv, ctx = cv.getContext("2d"), w = v.videoWidth, h = v.videoHeight;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const p = c.blur / 100;
  if (CAN_FILTER) {
    const px = Math.round(p * 40), pad = px * 2;
    ctx.filter = "blur(" + px + "px)";
    ctx.drawImage(v, -pad, -pad, w + pad * 2, h + pad * 2);   // 縁が透けないように、少し大きく描く
    ctx.filter = "none";
  } else {
    // フィルターが使えないブラウザ(iPhoneなど): いったん小さくして、引き伸ばしてぼかす
    const k = 1 + p * 30;
    const sm = c.small || (c.small = document.createElement("canvas"));
    sm.width = Math.max(2, Math.round(w / k)); sm.height = Math.max(2, Math.round(h / k));
    const sctx = sm.getContext("2d");
    sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = "high";
    sctx.drawImage(v, 0, 0, sm.width, sm.height);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    ctx.drawImage(sm, 0, 0, w, h);
  }
}
async function swapSender(c, track) {
  const s = c.pc && c.pc.getSenders().find((x) => x.track && x.track.kind === "video");
  if (s && track) { try { await s.replaceTrack(track); } catch (e) {} }
}
function blurStart(c) {
  const src = $("srcVideo");
  src.srcObject = new MediaStream(c.stream.getVideoTracks());
  src.play().catch(() => {});
  if (!c.cv) { c.cv = document.createElement("canvas"); c.cv.width = 640; c.cv.height = 480; }
  if (!c.blurTrack) c.blurTrack = c.cv.captureStream(24).getVideoTracks()[0];
  clearInterval(c.blurTimer);
  c.blurTimer = setInterval(() => blurDraw(c), 42);
  swapSender(c, c.blurTrack);
  $("localVideo").srcObject = new MediaStream([c.blurTrack]);   // 自分の小さい映像も、相手に見えている通りにする
}
function blurStop(c) {
  clearInterval(c.blurTimer);
  swapSender(c, c.stream.getVideoTracks()[0]);
  $("localVideo").srcObject = c.stream;
}
$("callFlip").addEventListener("click", flipCam);
$("callBlur").addEventListener("click", () => {
  const c = callSt;
  if (!c || !c.stream) return;
  c.blurOn = !c.blurOn;
  if (c.blur == null) c.blur = 50;   // 最初は50%
  $("callBlur").textContent = c.blurOn ? "🌫 ぼかしを外す" : "🌫 ぼかし";
  $("blurRow").style.display = c.blurOn ? "flex" : "none";
  $("blurRange").value = c.blur;
  $("blurVal").textContent = c.blur + "%";
  if (c.blurOn) blurStart(c); else blurStop(c);
});

});
